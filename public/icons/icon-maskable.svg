<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Full-bleed background gradient (no border-radius for maskable safe zone) -->
    <linearGradient id="maskableBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2e1065"/>
      <stop offset="50%" stopColor="#1e0c3d"/>
      <stop offset="100%" stopColor="#090514"/>
    </linearGradient>

    <!-- Robot outer body (vibrant violet & lavender) -->
    <linearGradient id="robotBodyM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#C084FC"/>
      <stop offset="50%" stopColor="#9333EA"/>
      <stop offset="100%" stopColor="#6B21A8"/>
    </linearGradient>

    <!-- Robot face screen (clean pearl white / soft lilac) -->
    <linearGradient id="robotFaceM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="100%" stopColor="#F3E8FF"/>
    </linearGradient>

    <linearGradient id="accentGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F472B6"/>
      <stop offset="100%" stopColor="#DB2777"/>
    </linearGradient>

    <filter id="cyanGlowM" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadowM" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Full bleed background for adaptive icon masking -->
  <rect width="512" height="512" fill="url(#maskableBg)"/>
  
  <!-- Subtle center glow inside safe zone -->
  <circle cx="256" cy="265" r="150" fill="#9333EA" opacity="0.3" filter="url(#cyanGlowM)"/>

  <!-- Scaled down to 82% to fit comfortably inside the 80% Android maskable safe circle -->
  <g transform="translate(256 265) scale(0.82) translate(-256 -270)" filter="url(#softShadowM)">
    <!-- Shadow underneath -->
    <ellipse cx="256" cy="450" rx="140" ry="22" fill="#000000" opacity="0.5"/>

    <!-- Left Plush / Robot Ear -->
    <rect x="145" y="145" width="60" height="60" rx="20" fill="url(#accentGradM)" transform="rotate(-15 175 175)"/>
    <rect x="157" y="157" width="36" height="36" rx="12" fill="#FDF2F8" transform="rotate(-15 175 175)"/>

    <!-- Right Plush / Robot Ear -->
    <rect x="307" y="145" width="60" height="60" rx="20" fill="url(#accentGradM)" transform="rotate(15 337 175)"/>
    <rect x="319" y="157" width="36" height="36" rx="12" fill="#FDF2F8" transform="rotate(15 337 175)"/>

    <!-- Center Hologram Antenna Stem -->
    <line x1="256" y1="180" x2="256" y2="110" stroke="#C084FC" stroke-width="10" stroke-linecap="round"/>
    <!-- Glowing Antenna Orb -->
    <circle cx="256" cy="98" r="22" fill="#38BDF8" filter="url(#cyanGlowM)"/>
    <circle cx="256" cy="98" r="12" fill="#E0F2FE"/>
    <circle cx="252" cy="94" r="5" fill="#FFFFFF"/>

    <!-- Main Outer Cube Body -->
    <rect x="116" y="170" width="280" height="260" rx="72" fill="url(#robotBodyM)" stroke="#E9D5FF" stroke-width="4"/>

    <!-- Inner Clean White Face Screen -->
    <rect x="136" y="194" width="240" height="212" rx="54" fill="url(#robotFaceM)"/>

    <!-- Top Seam -->
    <path d="M 180 206 L 195 206 M 225 206 L 240 206 M 272 206 L 287 206 M 317 206 L 332 206" stroke="#D8B4FE" stroke-width="4" stroke-linecap="round"/>

    <!-- Sparkly Anime Eyes -->
    <g>
      <!-- Left Eye -->
      <ellipse cx="198" cy="285" rx="22" ry="30" fill="#2E1065"/>
      <ellipse cx="198" cy="292" rx="18" ry="20" fill="#581C87"/>
      <circle cx="190" cy="275" r="10" fill="#FFFFFF"/>
      <circle cx="206" cy="296" r="5" fill="#E9D5FF"/>
      
      <!-- Right Eye -->
      <ellipse cx="314" cy="285" rx="22" ry="30" fill="#2E1065"/>
      <ellipse cx="314" cy="292" rx="18" ry="20" fill="#581C87"/>
      <circle cx="306" cy="275" r="10" fill="#FFFFFF"/>
      <circle cx="322" cy="296" r="5" fill="#E9D5FF"/>
    </g>

    <!-- Cheeks -->
    <ellipse cx="166" cy="320" rx="18" ry="10" fill="#FB7185" opacity="0.75"/>
    <ellipse cx="346" cy="320" rx="18" ry="10" fill="#FB7185" opacity="0.75"/>

    <!-- Mouth -->
    <path d="M 238 316 Q 247 326 256 316 Q 265 326 274 316" stroke="#4C1D95" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Paws -->
    <circle cx="186" cy="428" r="22" fill="#A855F7" stroke="#7E22CE" stroke-width="4"/>
    <circle cx="326" cy="428" r="22" fill="#A855F7" stroke="#7E22CE" stroke-width="4"/>
    <circle cx="186" cy="428" r="9" fill="#F472B6"/>
    <circle cx="326" cy="428" r="9" fill="#F472B6"/>
  </g>
</svg>
