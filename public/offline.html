<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aura Offline</title>
    <meta name="theme-color" content="#7e22ce" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at 50% 30%, #1e1035, #090514);
        color: #f3e8ff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: rgba(30, 16, 53, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(192, 132, 252, 0.25);
        border-radius: 32px;
        padding: 40px 28px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      }
      .mascot {
        width: 110px;
        height: 110px;
        margin: 0 auto 20px;
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        background: linear-gradient(135deg, #c084fc, #f472b6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 12px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #d8b4fe;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 14px 24px;
        border-radius: 20px;
        background: linear-gradient(135deg, #9333ea, #db2777);
        color: #ffffff;
        font-weight: 700;
        font-size: 14px;
        border: none;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(147, 51, 234, 0.35);
        transition: transform 0.15s, opacity 0.15s;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .badge {
        display: inline-block;
        margin-top: 18px;
        padding: 4px 12px;
        border-radius: 9999px;
        background: rgba(251, 113, 133, 0.15);
        color: #fb7185;
        font-size: 11px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mascot">
        <svg viewBox="0 0 160 160" width="100%" height="100%">
          <rect x="24" y="32" width="112" height="110" rx="32" fill="#9333EA" stroke="#C084FC" stroke-width="3"/>
          <rect x="32" y="42" width="96" height="90" rx="24" fill="#FAF5FF"/>
          <!-- Eyes sleeping / waiting -->
          <path d="M 48 80 Q 58 84 68 80" stroke="#6B21A8" stroke-width="4" stroke-linecap="round" fill="none"/>
          <path d="M 92 80 Q 102 84 112 80" stroke="#6B21A8" stroke-width="4" stroke-linecap="round" fill="none"/>
          <ellipse cx="44" cy="90" rx="8" ry="4.5" fill="#FB7185" opacity="0.6"/>
          <ellipse cx="116" cy="90" rx="8" ry="4.5" fill="#FB7185" opacity="0.6"/>
          <path d="M 74 88 Q 77 92 80 88 Q 83 92 86 88" stroke="#581C87" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <!-- Antenna -->
          <line x1="80" y1="34" x2="80" y2="14" stroke="#A855F7" stroke-width="4" stroke-linecap="round"/>
          <circle cx="80" cy="12" r="7" fill="#38BDF8"/>
        </svg>
      </div>

      <h1>Kamu Sedang Offline 🌸</h1>
      <p>
        Tenang ya! Aura tetap mendampingi kamu. Begitu koneksi internetmu terhubung kembali, sinkronisasi kalender dan riset akan aktif secara otomatis.
      </p>

      <button class="btn" onclick="window.location.reload()">
        Coba Muat Ulang
      </button>

      <div>
        <span class="badge">Mode Hemat Kuota / Tanpa Internet</span>
      </div>
    </div>
  </body>
</html>
